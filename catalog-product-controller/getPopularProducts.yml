info:
  name: getPopularProducts
  type: http
  seq: 4
  tags:
    - catalog-product-controller

http:
  method: GET
  url: "{{baseUrl}}/api/catalog/products/popular"
  params:
    - name: page
      value: "0"
      type: query
      disabled: true
    - name: size
      value: "1"
      type: query
      disabled: true
    - name: sort
      value: "[]"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

