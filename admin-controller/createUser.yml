info:
  name: createUser
  type: http
  seq: 5
  tags:
    - admin-controller

http:
  method: POST
  url: "{{baseUrl}}/api/admin/users"
  body:
    type: json
    data: |-
      {
        "phoneNumber": "",
        "password": "",
        "fullName": "",
        "role": "USER",
        "enabled": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/admin/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "phoneNumber": "",
            "password": "",
            "fullName": "",
            "role": "USER",
            "enabled": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "phoneNumber": "",
            "fullName": "",
            "profileImageUrl": "",
            "role": "USER",
            "enabled": false,
            "accountLocked": false,
            "failedLoginAttempts": 0,
