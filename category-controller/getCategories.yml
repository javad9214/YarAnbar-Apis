info:
  name: getCategories
  type: http
  seq: 1
  tags:
    - category-controller

http:
  method: GET
  url: "{{baseUrl}}/api/categories"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

