      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "resCode": 0,
            "resMessage": "",
            "info": [
              {
                "id": 0,
                "name": "",
                "icon": "",
                "subcategories": [
                  {
                    "id": 0,
                    "name": "",
                    "icon": ""
                  }
                ]
              }
            ]
          }
