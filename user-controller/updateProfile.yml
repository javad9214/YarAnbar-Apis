info:
  name: updateProfile
  type: http
  seq: 2
  tags:
    - user-controller

http:
  method: PUT
  url: "{{baseUrl}}/api/auth/profile"
  body:
    type: json
    data: |-
      {
        "fullName": "",
        "profileImageUrl": "",
        "deviceToken": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/auth/profile"
      method: PUT
      body:
        type: json
        data: |-
          {
            "fullName": "",
            "profileImageUrl": "",
            "deviceToken": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "phoneNumber": "",
            "fullName": "",
            "profileImageUrl": "",
            "role": "USER",
            "enabled": false,
            "createdAt": "",
            "lastLogin": ""
          }
