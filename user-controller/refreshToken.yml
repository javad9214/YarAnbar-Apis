info:
  name: refreshToken
  type: http
  seq: 4
  tags:
    - user-controller

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refreshToken": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "token": "",
            "refreshToken": "",
            "tokenType": "",
            "user": {
              "id": 0,
              "phoneNumber": "",
              "fullName": "",
              "profileImageUrl": "",
              "role": "USER",
              "enabled": false,
              "createdAt": "",
              "lastLogin": ""
            },
            "message": ""
          }
