info:
  name: checkVersion
  type: http
  seq: 6
  tags:
    - app-version-controller

http:
  method: GET
  url: "{{baseUrl}}/api/version/check"
  params:
    - name: platform
      value: ANDROID
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/version/check"
      method: GET
      params:
        - name: platform
          value: ANDROID
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "platform": "",
            "minVersionCode": 0,
            "lastVersionCode": 0,
            "minVersionName": "",
            "lastVersionName": "",
            "updateUrl": "",
            "releaseNotes": "",
            "enabled": false,
            "createdAt": "",
            "updatedAt": ""
          }
